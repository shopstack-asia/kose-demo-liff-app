<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="shippingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="truckGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f4da1;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#1f4da1;stop-opacity:0.08" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="240" fill="url(#shippingGradient)" rx="16"/>
  
  <!-- Decorative circles -->
  <circle cx="320" cy="60" r="80" fill="url(#truckGradient)"/>
  <circle cx="340" cy="80" r="60" fill="url(#truckGradient)" opacity="0.5"/>
  
  <!-- Truck icon -->
  <g transform="translate(260, 50)">
    <!-- Truck body -->
    <rect x="20" y="40" width="50" height="30" fill="#1f4da1" opacity="0.2" rx="4"/>
    <rect x="20" y="40" width="50" height="15" fill="#1f4da1" opacity="0.3" rx="4"/>
    
    <!-- Truck cabin -->
    <rect x="70" y="45" width="25" height="25" fill="#1f4da1" opacity="0.25" rx="3"/>
    
    <!-- Windows -->
    <rect x="73" y="48" width="19" height="12" fill="#ffffff" opacity="0.6" rx="2"/>
    
    <!-- Wheels -->
    <circle cx="35" cy="75" r="8" fill="#1f4da1" opacity="0.3"/>
    <circle cx="35" cy="75" r="5" fill="#ffffff" opacity="0.8"/>
    <circle cx="75" cy="75" r="8" fill="#1f4da1" opacity="0.3"/>
    <circle cx="75" cy="75" r="5" fill="#ffffff" opacity="0.8"/>
    
    <!-- Speed lines -->
    <line x1="10" y1="50" x2="20" y2="50" stroke="#1f4da1" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="10" y1="60" x2="20" y2="60" stroke="#1f4da1" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
    <line x1="10" y1="70" x2="20" y2="70" stroke="#1f4da1" stroke-width="2" opacity="0.4" stroke-linecap="round"/>
  </g>
  
  <!-- KOSE brand accent -->
  <text x="40" y="200" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1f4da1" opacity="0.6">KOSÉ</text>
</svg>


